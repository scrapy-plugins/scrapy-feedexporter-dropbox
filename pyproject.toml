[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scrapy-feedexporter-dropbox"
version = "0.2.0"
description = "Scrapy feed export storage backend for Dropbox"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Scrapy developers" },
]
requires-python = ">=3.10"
dependencies = [
    "dropbox>=12.0.0",
    "scrapy>=2.11.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Scrapy",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Source = "https://github.com/scrapy-plugins/scrapy-feedexporter-dropbox"
Tracker = "https://github.com/scrapy-plugins/scrapy-feedexporter-dropbox/issues"
"Release notes" = "https://github.com/scrapy-plugins/scrapy-feedexporter-dropbox/blob/main/CHANGES.rst"

[tool.hatch.build.targets.wheel]
packages = ["scrapy_dropbox"]

[tool.hatch.build.targets.sdist]
include = [
    "/scrapy_dropbox",
    "/tests",
    "/CHANGES.rst",
    "/tox.ini",
]

[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGES.rst"
search = "\\(unreleased\\)$"
replace = "({now:%Y-%m-%d})"
regex = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
