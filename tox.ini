[tox]
envlist = min,py310,py311,py312,py313,py314,twinecheck

[testenv]
deps =
    pytest
    pytest-twisted
commands =
    pytest {posargs:tests}

[testenv:min]
basepython = python3.10
deps =
    {[testenv]deps}
    dropbox==12.0.0
    scrapy==2.11.0
    # w3lib 2.5.0 removed a private name that Scrapy 2.12 and lower import.
    w3lib==2.4.1

[testenv:twinecheck]
skip_install = true
deps =
    build==1.6.1
    twine==7.0.0
commands =
    python -m build
    twine check --strict dist/*
